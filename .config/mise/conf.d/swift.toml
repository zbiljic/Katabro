[tasks."swift:format"]
description = "Format Swift source code"
run = "swiftformat ."

[tasks."swift:format-check"]
description = "Check Swift source formatting"
run = "swiftformat --lint ."

[tasks."swift:lint"]
description = "Lint Swift source code"
run = '''
if test -f Project.swift || test -f Tuist.swift || \
    test -n "$(find Sources Tests Packages -type f -name '*.swift' -not -path '*/.build/*' -print -quit 2>/dev/null)"; then
    swiftlint lint --strict
else
    swiftlint version >/dev/null
fi
'''

[tasks."core:build"]
description = "Build the portable KatabroCore package"
run = "swift build --package-path Packages/KatabroCore"

[tasks."core:test"]
description = "Test the portable KatabroCore package"
run = "swift test --package-path Packages/KatabroCore"

[tasks."core:clean"]
description = "Remove Swift package build artifacts"
run = "swift package --package-path Packages/KatabroCore clean"

[tasks."app:generate"]
description = "Generate the Katabro Xcode project without opening Xcode"
run = "tuist generate run --no-open"

[tasks."app:build"]
description = "Build the Katabro application"
depends = ["app:generate"]
run = "tuist xcodebuild build -scheme Katabro -configuration Debug -derivedDataPath Derived"

[tasks."app:test"]
description = "Test the Katabro application"
depends = ["app:generate"]
run = "tuist xcodebuild test -scheme Katabro -configuration Debug -derivedDataPath Derived"

[tasks."app:clean"]
description = "Remove generated Xcode and app build artifacts"
run = "rm -rf Derived Katabro.xcodeproj Katabro.xcworkspace"
