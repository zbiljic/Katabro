name: UI Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-tests:
    name: UI Tests
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          developer_dir=/Applications/Xcode_27.0.app/Contents/Developer
          if [[ ! -d "$developer_dir" ]]; then
            developer_dir=/Applications/Xcode_26.6.app/Contents/Developer
          fi
          sudo xcode-select --switch "$developer_dir"
          xcodebuild -version

      - name: Install development tools
        uses: jdx/mise-action@v5

      - name: Suppress notification banners
        id: notifications
        run: |
          service="gui/$(id -u)/com.apple.notificationcenterui.agent"
          if launchctl print "$service" >/dev/null 2>&1; then
            launchctl bootout "$service"
            echo "stopped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Notification Center is not running; no banners to suppress."
          fi

      - name: Run UI tests
        run: mise run app:test:ui

      - name: Restore Notification Center
        if: ${{ always() && steps.notifications.outputs.stopped == 'true' }}
        run: launchctl bootstrap "gui/$(id -u)" /System/Library/LaunchAgents/com.apple.notificationcenterui.plist
